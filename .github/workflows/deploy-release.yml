name: Deploy Existing Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release tag to deploy
        required: true
        type: string

run-name: Redeploy ${{ inputs.release_tag }}

permissions:
  contents: read

concurrency:
  group: study-qb-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Redeploy immutable release
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      DEPLOY_HEALTH_URL: ${{ vars.DEPLOY_HEALTH_URL }}
      DEPLOY_DOCKER_CONTEXT: ${{ vars.DEPLOY_DOCKER_CONTEXT || 'rootless' }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}

      - name: Download release manifest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid release tag" >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/release"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern release-manifest.json --dir "$RUNNER_TEMP/release"

      - name: Validate release manifest
        id: manifest
        env:
          MANIFEST_PATH: ${{ runner.temp }}/release/release-manifest.json
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re

          with open(os.environ["MANIFEST_PATH"], encoding="utf-8") as handle:
              payload = json.load(handle)

          tag = os.environ["RELEASE_TAG"]
          version = tag.removeprefix("v")
          repository = os.environ["GITHUB_REPOSITORY"]
          expected_image = f"ghcr.io/{repository.lower()}"
          digest = str(payload.get("image_digest") or "")
          image = str(payload.get("image") or "").lower()
          build_sha = str(payload.get("commit_sha") or "")

          valid = (
              payload.get("schema_version") == 1
              and payload.get("tag") == tag
              and payload.get("version") == version
              and str(payload.get("repository") or "").lower() == repository.lower()
              and image == expected_image
              and re.fullmatch(r"sha256:[a-f0-9]{64}", digest)
              and re.fullmatch(r"[a-f0-9]{40}", build_sha)
          )
          if not valid:
              raise SystemExit("Release manifest validation failed")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"image_ref={image}@{digest}\n")
              handle.write(f"version={version}\n")
              handle.write(f"build_sha={build_sha}\n")
          PY

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ "${DEPLOY_HOST}" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "Invalid DEPLOY_HOST" >&2; exit 1; }
          [[ "${DEPLOY_PORT}" =~ ^[1-9][0-9]{0,4}$ ]] || { echo "Invalid DEPLOY_PORT" >&2; exit 1; }
          (( 10#${DEPLOY_PORT} <= 65535 )) || { echo "Invalid DEPLOY_PORT" >&2; exit 1; }
          [[ "${DEPLOY_USER}" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]] || { echo "Invalid DEPLOY_USER" >&2; exit 1; }
          [[ "${DEPLOY_PATH}" =~ ^/[A-Za-z0-9._/-]+$ ]] || { echo "Invalid DEPLOY_PATH" >&2; exit 1; }
          [[ "${DEPLOY_HEALTH_URL}" =~ ^https?://127\.0\.0\.1:[1-9][0-9]{0,4}$ ]] || { echo "Invalid DEPLOY_HEALTH_URL" >&2; exit 1; }
          [[ "${DEPLOY_DOCKER_CONTEXT}" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "Invalid DEPLOY_DOCKER_CONTEXT" >&2; exit 1; }
          [[ -n "${DEPLOY_SSH_PRIVATE_KEY}" ]] || { echo "DEPLOY_SSH_PRIVATE_KEY is not configured" >&2; exit 1; }
          [[ -n "${DEPLOY_KNOWN_HOSTS}" ]] || { echo "DEPLOY_KNOWN_HOSTS is not configured" >&2; exit 1; }

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Apply immutable release image
        env:
          IMAGE_REF: ${{ steps.manifest.outputs.image_ref }}
          VERSION: ${{ steps.manifest.outputs.version }}
          BUILD_SHA: ${{ steps.manifest.outputs.build_sha }}
        shell: bash
        run: |
          set -euo pipefail
          ssh_args=(-p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          scp_args=(-P "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          remote_target="${DEPLOY_USER}@${DEPLOY_HOST}"
          remote_stage_dir="$(ssh "${ssh_args[@]}" "$remote_target" 'set -euo pipefail; mkdir -p "$HOME/.cache"; mktemp -d "$HOME/.cache/stqb-release.XXXXXX"')"
          [[ "$remote_stage_dir" =~ ^/home/[A-Za-z0-9_-]+/\.cache/stqb-release\.[A-Za-z0-9]+$ ]] || { echo "Invalid remote staging directory" >&2; exit 1; }
          cleanup_remote_stage() {
            ssh "${ssh_args[@]}" "$remote_target" "rm -rf '$remote_stage_dir'" || true
          }
          trap cleanup_remote_stage EXIT
          scp "${scp_args[@]}" docker-compose.yaml "$remote_target:$remote_stage_dir/docker-compose.release.yaml"
          scp "${scp_args[@]}" deploy/remote-release.sh "$remote_target:$remote_stage_dir/remote-release.sh"
          ssh "${ssh_args[@]}" "$remote_target" \
            "set -euo pipefail; install -d -m 0755 '$DEPLOY_PATH/deploy'; install -m 0644 '$remote_stage_dir/docker-compose.release.yaml' '$DEPLOY_PATH/deploy/docker-compose.release.yaml'; install -m 0700 '$remote_stage_dir/remote-release.sh' '$DEPLOY_PATH/deploy/remote-release.sh'; STQB_DEPLOY_DOCKER_CONTEXT='$DEPLOY_DOCKER_CONTEXT' bash '$DEPLOY_PATH/deploy/remote-release.sh' '$DEPLOY_PATH' '$IMAGE_REF' '$VERSION' '$BUILD_SHA' '$DEPLOY_HEALTH_URL'"
