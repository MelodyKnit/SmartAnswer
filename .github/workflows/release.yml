name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag and project version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          PROJECT_VERSION="$(python3 - <<'PY'
          import tomllib
          with open('pyproject.toml', 'rb') as handle:
              print(tomllib.load(handle)['project']['version'])
          PY
          )"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must use vX.Y.Z format" >&2
            exit 1
          fi
          if [[ "${PROJECT_VERSION}" != "${VERSION}" ]]; then
            echo "Tag ${TAG} does not match pyproject.toml ${PROJECT_VERSION}" >&2
            exit 1
          fi
          TAG_COMMIT="$(git rev-list -n 1 "${TAG}")"
          if [[ "${TAG_COMMIT}" != "${GITHUB_SHA}" ]]; then
            echo "Tag does not point to the workflow commit" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest ruff httpx dulwich "psycopg[binary]"

      - name: Validate backend
        run: |
          ruff check src tests deploy/updater/stqb_updater.py
          pytest -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/website/package-lock.json

      - name: Build frontend
        working-directory: src/website
        run: |
          npm ci
          npm run build

      - name: Set image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push version image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            BUILD_SHA=${{ github.sha }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}
            ${{ steps.image.outputs.name }}:${{ github.ref_name }}
            ${{ steps.image.outputs.name }}:stable
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Create release manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
          IMAGE: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          payload = {
              "schema_version": 1,
              "version": os.environ["VERSION"],
              "tag": os.environ["GITHUB_REF_NAME"],
              "repository": os.environ["GITHUB_REPOSITORY"],
              "commit_sha": os.environ["GITHUB_SHA"],
              "image": os.environ["IMAGE"],
              "image_digest": os.environ["IMAGE_DIGEST"],
              "platform": "linux/amd64",
          }
          with open("release-manifest.json", "w", encoding="utf-8", newline="\n") as handle:
              json.dump(payload, handle, ensure_ascii=False, indent=2)
              handle.write("\n")
          PY

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" release-manifest.json --clobber
          else
            gh release create "${GITHUB_REF_NAME}" release-manifest.json \
              --verify-tag \
              --generate-notes \
              --title "${GITHUB_REF_NAME}"
          fi
