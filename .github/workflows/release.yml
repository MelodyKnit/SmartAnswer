name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      image: ${{ steps.image.outputs.name }}
      image_digest: ${{ steps.build.outputs.digest }}
      build_sha: ${{ github.sha }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag and project version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          PROJECT_VERSION="$(python3 - <<'PY'
          import tomllib
          with open('pyproject.toml', 'rb') as handle:
              print(tomllib.load(handle)['project']['version'])
          PY
          )"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must use vX.Y.Z format" >&2
            exit 1
          fi
          if [[ "${PROJECT_VERSION}" != "${VERSION}" ]]; then
            echo "Tag ${TAG} does not match pyproject.toml ${PROJECT_VERSION}" >&2
            exit 1
          fi
          TAG_COMMIT="$(git rev-list -n 1 "${TAG}")"
          if [[ "${TAG_COMMIT}" != "${GITHUB_SHA}" ]]; then
            echo "Tag does not point to the workflow commit" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest ruff httpx dulwich "psycopg[binary]"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/website/package-lock.json

      - name: Build frontend
        working-directory: src/website
        run: |
          npm ci
          npm run build

      - name: Validate backend
        run: |
          bash -n deploy/remote-release.sh
          ruff check src tests
          pytest -q

      - name: Set image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push version image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            BUILD_SHA=${{ github.sha }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}
            ${{ steps.image.outputs.name }}:${{ github.ref_name }}
            ${{ steps.image.outputs.name }}:stable
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Create release manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
          IMAGE: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          payload = {
              "schema_version": 1,
              "version": os.environ["VERSION"],
              "tag": os.environ["GITHUB_REF_NAME"],
              "repository": os.environ["GITHUB_REPOSITORY"],
              "commit_sha": os.environ["GITHUB_SHA"],
              "image": os.environ["IMAGE"],
              "image_digest": os.environ["IMAGE_DIGEST"],
              "platform": "linux/amd64",
          }
          with open("release-manifest.json", "w", encoding="utf-8", newline="\n") as handle:
              json.dump(payload, handle, ensure_ascii=False, indent=2)
              handle.write("\n")
          PY

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" release-manifest.json --clobber
          else
            gh release create "${GITHUB_REF_NAME}" release-manifest.json \
              --verify-tag \
              --generate-notes \
              --title "${GITHUB_REF_NAME}"
          fi

  deploy:
    name: Deploy release to configured server
    needs: release
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    concurrency:
      group: study-qb-production-deploy
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      DEPLOY_HEALTH_URL: ${{ vars.DEPLOY_HEALTH_URL || 'http://127.0.0.1:3003' }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
      IMAGE_REF: ${{ needs.release.outputs.image }}@${{ needs.release.outputs.image_digest }}
      VERSION: ${{ needs.release.outputs.version }}
      BUILD_SHA: ${{ needs.release.outputs.build_sha }}
    steps:
      - name: Checkout deployment assets
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ "${DEPLOY_HOST}" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "Invalid DEPLOY_HOST" >&2; exit 1; }
          [[ "${DEPLOY_PORT}" =~ ^[1-9][0-9]{0,4}$ ]] || { echo "Invalid DEPLOY_PORT" >&2; exit 1; }
          (( 10#${DEPLOY_PORT} <= 65535 )) || { echo "Invalid DEPLOY_PORT" >&2; exit 1; }
          [[ "${DEPLOY_USER}" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]] || { echo "Invalid DEPLOY_USER" >&2; exit 1; }
          [[ "${DEPLOY_PATH}" =~ ^/[A-Za-z0-9._/-]+$ ]] || { echo "Invalid DEPLOY_PATH" >&2; exit 1; }
          [[ "${DEPLOY_HEALTH_URL}" =~ ^https?://127\.0\.0\.1:[1-9][0-9]{0,4}$ ]] || { echo "Invalid DEPLOY_HEALTH_URL" >&2; exit 1; }
          [[ "${IMAGE_REF}" =~ ^ghcr\.io/melodyknit/smartanswer@sha256:[a-f0-9]{64}$ ]] || { echo "Invalid image digest" >&2; exit 1; }
          [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid release version" >&2; exit 1; }
          [[ "${BUILD_SHA}" =~ ^[a-f0-9]{40}$ ]] || { echo "Invalid release revision" >&2; exit 1; }
          [[ -n "${DEPLOY_SSH_PRIVATE_KEY}" ]] || { echo "DEPLOY_SSH_PRIVATE_KEY is not configured" >&2; exit 1; }
          [[ -n "${DEPLOY_KNOWN_HOSTS}" ]] || { echo "DEPLOY_KNOWN_HOSTS is not configured" >&2; exit 1; }
          [[ -n "${GHCR_READ_TOKEN}" ]] || { echo "GHCR_READ_TOKEN is not configured" >&2; exit 1; }

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Apply immutable release image
        shell: bash
        run: |
          set -euo pipefail
          ssh_args=(-p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          scp_args=(-P "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          remote_target="${DEPLOY_USER}@${DEPLOY_HOST}"
          remote_deploy_dir="${DEPLOY_PATH}/deploy"
          ssh "${ssh_args[@]}" "$remote_target" "mkdir -p '$remote_deploy_dir'"
          scp "${scp_args[@]}" docker-compose.yaml "$remote_target:$remote_deploy_dir/docker-compose.release.yaml"
          scp "${scp_args[@]}" deploy/remote-release.sh "$remote_target:$remote_deploy_dir/remote-release.sh"
          ssh "${ssh_args[@]}" "$remote_target" "chmod 700 '$remote_deploy_dir/remote-release.sh'"
          printf '%s\n' "$GHCR_READ_TOKEN" | ssh "${ssh_args[@]}" "$remote_target" \
            "bash '$remote_deploy_dir/remote-release.sh' '$DEPLOY_PATH' '$IMAGE_REF' '$VERSION' '$BUILD_SHA' '$DEPLOY_HEALTH_URL'"
