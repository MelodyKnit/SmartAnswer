ci:
  # pre-commit.ci 不提供项目的 Conda 和 Node.js 环境；完整测试与前端构建
  # 仍由本地门禁和发布 workflow 执行。
  skip: [mypy-backend, pytest-backend, website-build]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.21
    hooks:
      - id: ruff-check
        name: ruff check
        require_serial: true
        types_or: [python, pyi]

  - repo: local
    hooks:
      - id: mypy-backend
        name: mypy backend
        entry: conda run --no-capture-output -n ai-study-qb python -m mypy src/study_qb_assistant
        language: system
        pass_filenames: false
        types_or: [python, pyi]

      - id: pytest-backend
        name: pytest backend
        entry: conda run --no-capture-output -n ai-study-qb python -m pytest -q
        language: system
        pass_filenames: false
        types_or: [python, pyi]

      - id: website-build
        name: website build
        entry: npm run --prefix src/website build
        language: system
        pass_filenames: false
        files: ^src/website/
