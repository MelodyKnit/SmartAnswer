[project]
name = "study-question-bank-assistant"
version = "0.1.24"
description = "Study-oriented question-bank ingestion and retrieval foundation."
requires-python = ">=3.13"
dependencies = [
  "fastapi",
  "httpx",
  "jinja2",
  "playwright",
  "python-dotenv",
  "rapidocr-onnxruntime",
  "rapidfuzz",
  "redis",
  "sqlalchemy",
  "uvicorn",
]

[tool.black]
line-length = 100

[tool.setuptools.package-data]
study_qb_assistant = ["platform/*.jsonl"]
