[project]
name = "study-question-bank-assistant"
version = "0.9.0"
description = "Study-oriented question-bank ingestion and retrieval foundation."
license = { text = "CC-BY-NC-SA-4.0" }
requires-python = ">=3.13"
dependencies = [
  "fastapi",
  "httpx",
  "jinja2",
  "playwright",
  "python-dotenv",
  "rapidocr-onnxruntime",
  "python-multipart",
  "pillow",
  "rapidfuzz",
  "redis",
  "sqlalchemy",
  "uvicorn",
]

[tool.pytest.ini_options]
# 只收集单元测试；tests/manual 存放需要手动执行的联调/验证脚本，不参与自动测试。
testpaths = ["tests"]
norecursedirs = ["tests/manual"]

[tool.black]
line-length = 100

[tool.ruff.lint]
# 固定项目当前采用的基础规则集，避免 Ruff 升级后默认规则变化导致发布结果漂移。
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.package-data]
study_qb_assistant = [
  "adapters/ocs/resources/*.json",
  "adapters/ocs/resources/*.js",
]
